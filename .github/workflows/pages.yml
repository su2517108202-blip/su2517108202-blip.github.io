# 由 DSH 的 daily-inspiration 插件自动维护：把仓库根目录的静态站点发布到 GitHub Pages。
name: Deploy daily inspiration to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site (exclude git metadata)
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
