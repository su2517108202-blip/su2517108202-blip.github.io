name: hot-refresh

# 云端热榜刷新：每 15 分钟跑一次，不需要你的电脑开着，也不调模型（不花额度）
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 刷新热榜
        run: node .github/scripts/hot.mjs
      - name: 提交
        run: |
          git config user.name "hot-bot"
          git config user.email "hot-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "hot: 云端刷新热榜"
            git push
          fi
